# baseURL: "https://christian-vdz.github.io/helm-charts/"
title: christian-vdz/helm-charts
module:
  imports:
    - path: github.com/imfing/hextra

enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search
    - name: GitHub
      weight: 2
      url: "https://github.com/christian-vdz"
      params:
        icon: github

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - identifier: GitHub Issues
      name: GitHub Issues
      url: "https://github.com/christian-vdz/helm-charts/issues"

params:
  navbar:
    width: wide
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/christian-vdz/helm-charts/edit/main/docs/content"

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  page:
    width: wide
  
  theme:
    default: system
    displayToggle: true
