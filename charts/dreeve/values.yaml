nameOverride: ""
fullnameOverride: ""

appUrl: http://localhost:8080
# https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
timezone: Europe/Paris

# Used to sign the admin session cookie. Set it to any long random string.
appSecret: "change-me-to-a-long-random-string"

# Admin credentials. The passwordHash is a bcrypt hash of the password.
# https://docs.dreeve.app/getting-started/installation/#admin-password
admin:
  username: "admin"
  passwordHash: "replace-me-with-a-bcrypt-hash-of-your-password"

# Set to true to use an existing secret instead of creating a new one.
useExistingSecret: false
existingSecretName: ""

strava:
  # Set to true to enable Strava API integration. If false, the app will run in file import mode.
  enabled: false
  # Strava API credentials. Required if useExistingSecret is false.
  clientId: ""
  clientSecret: ""
  refreshToken: ""
  useExistingSecret: false
  existingSecretName: ""

app:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/dreeveapp/dreeve
    tag: "" # Defaults to chart appVersion
  port: 8080
  readinessProbe:
    httpGet:
      path: /
      port: http
  livenessProbe:
    exec:
      command:
        - curl
        - -f
        - http://localhost:2019/metrics
    initialDelaySeconds: 60
  persistence:
    # storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    # limits:
    #   cpu: 1000m
    #   memory: 2048Mi

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
  extraHostnames: []
    # - dreeve.local

ingress:
  enabled: false
  host: ""
  className: ""
  annotations: {}
  tls: []
  paths:
    - path: /
      pathType: Prefix
  extraHosts: []
    # - host: dreeve.local
    #   paths:
    #     - path: /
    #       pathType: ImplementationSpecific

podLabels: {}
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

affinity: {}
nodeSelector: {}
tolerations: []

imagePullSecrets: []
