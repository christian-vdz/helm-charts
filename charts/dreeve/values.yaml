nameOverride: ""
fullnameOverride: ""

appUrl: http://localhost:8080
timezone: Europe/Paris

# Used to sign the admin session cookie. Set it to any long random string.
appSecret: ""

# Admin credentials. The passwordHash is a bcrypt hash of the password.
admin:
  username: "admin"
  passwordHash: ""

# Users who migrate from statistics-for-strava chart want "stravaApi" here.
# The default is "files".
importMode: "files"

# Set to true to use an existing secret instead of creating a new one.
useExistingSecret: false
existingSecretName: ""

strava:
  # Strava API credentials. Required if useExistingSecret is false.
  clientId: ""
  clientSecret: ""
  refreshToken: ""
  useExistingSecret: false
  existingSecretName: ""

app:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/dreeveapp/dreeve
    tag: ""  # Defaults to chart appVersion
  port: 8080
  readinessProbe:
    httpGet:
      path: /
      port: http
  livenessProbe:
    exec:
      command:
        - curl
        - -f
        - http://localhost:2019/metrics
    initialDelaySeconds: 60
  persistence:
    # storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    # limits:
    #   cpu: 1000m
    #   memory: 2048Mi

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /headers
  extraHostnames: []
    # - dreeve.local

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls: []
  extraHosts: []
    # - host: dreeve.local
    #   paths:
    #     - path: /
    #       pathType: ImplementationSpecific

podLabels: {}
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

affinity: {}
nodeSelector: {}
tolerations: []

imagePullSecrets: []

### Legacy config values. These are only used for migrating from v4 to v5. You can remove them once you have migrated.

# Override default config values. See config/default.yaml for all available options.
# Athlete's birth and weight history dates are required for the app to import data from Strava.
config:
  general:
    athlete:
      birthday: '2000-01-01'
      weightHistory:
        "2000-01-01": 60

# Set gear maintenance config values. See config/example-gear-maintenance.yaml for all available options.
# Note: the gear maintenance feature is disabled by default. Set `gearMaintenanceConfig.enabled` to true to enable it.
gearMaintenanceConfig:
  enabled: false
  hashtagPrefix: 'sfs'
  # List of components to track for maintenance. Each component can be attached to one or more gear and can have multiple maintenance tasks.
  # /!\ At least one component is required to enable the gear maintenance feature.
  components: []
  gears: []

# Set to true to clean up old config files that are no longer used by the app.
# See: https://docs.dreeve.app/#/getting-started/migrating-from-v4?id=_6-clean-up-the-old-configuration
cleanUpOldConfig: false
