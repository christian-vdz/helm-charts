{{- if not  .Values.papra.useExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $authSecret := (.Values.papra.authSecret) | default (randAlphaNum 64) }}
  AUTH_SECRET: {{ $authSecret | quote | b64enc }}
{{- end }}
