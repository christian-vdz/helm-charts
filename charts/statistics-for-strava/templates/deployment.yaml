apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}-app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          volumeMounts:
            - name: {{ include "app.fullname" . }}-config
              mountPath: /var/www/config/app
            - name: {{ include "app.fullname" . }}-claim0
              mountPath: /var/www/storage/database
            - name: {{ include "app.fullname" . }}-claim0
              mountPath: /var/www/storage/files
            - name: {{ include "app.fullname" . }}-build
              mountPath: /var/www/build
          env:
            - name: TZ
              value: {{ .Values.timezone }}
          envFrom:
            - secretRef:
            {{- if not .Values.strava.useExistingSecret }}
                name: {{ include "app.fullname" . }}
            {{- else }}
                name: {{ .Values.strava.existingSecretName }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: {{ .Chart.Name }}-daemon
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["bin/console"]
          args: ["app:daemon:run"]
          volumeMounts:
            - name: {{ include "app.fullname" . }}-config
              mountPath: /var/www/config/app
            - name: {{ include "app.fullname" . }}-claim0
              mountPath: /var/www/storage/database
            - name: {{ include "app.fullname" . }}-claim0
              mountPath: /var/www/storage/files
            - name: {{ include "app.fullname" . }}-build
              mountPath: /var/www/build
          env:
            - name: TZ
              value: {{ .Values.timezone }}
          envFrom:
            - secretRef:
            {{- if not .Values.strava.useExistingSecret }}
                name: {{ include "app.fullname" . }}
            {{- else }}
                name: {{ .Values.strava.existingSecretName }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: {{ include "app.fullname" . }}-config
          configMap:
            name: {{ include "app.fullname" . }}-config
        - name: {{ include "app.fullname" . }}-claim0
          persistentVolumeClaim:
            claimName: {{ include "app.fullname" . }}-claim0
        - name: {{ include "app.fullname" . }}-build
          persistentVolumeClaim:
            claimName: {{ include "app.fullname" . }}-build
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
