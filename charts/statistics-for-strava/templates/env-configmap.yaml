apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-env
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  TZ: Europe/Paris
  STRAVA_CLIENT_ID: {{ .Values.strava.clientId }}
  STRAVA_CLIENT_SECRET: {{ .Values.strava.clientSecret }}
  STRAVA_REFRESH_TOKEN: {{ .Values.strava.refreshToken }}
