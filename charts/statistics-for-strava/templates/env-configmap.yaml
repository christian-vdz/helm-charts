apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-env
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  STRAVA_CLIENT_ID: {{ .Values.strava.clientId | quote }}
  STRAVA_CLIENT_SECRET: {{ .Values.strava.clientSecret | quote }}
  STRAVA_REFRESH_TOKEN: {{ .Values.strava.refreshToken | quote }}
